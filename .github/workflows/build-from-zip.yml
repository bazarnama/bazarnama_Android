name: Build Bazarnama Android Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -oq bazarnama-android-project.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release
        run: gradle -p bazarnama-android --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: bazarnama-android-release-apk
          path: bazarnama-android/app/build/outputs/apk/release/app-release.apk

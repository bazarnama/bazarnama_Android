name: Build Bazarnama Android Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release project archive
        run: test -f bazarnama-android-release-project.zip

      - name: Extract Android project
        run: unzip -oq bazarnama-android-release-project.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p bazarnama-android --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bazarnama-android-release-apk
          path: bazarnama-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
